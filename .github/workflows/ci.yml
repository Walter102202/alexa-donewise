name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DONEWISE_MODE: sandbox
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not connected"
      - run: uv run donewise-evals --runner deterministic --output-dir ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-evals-${{ matrix.os }}
          path: ci-results/
          if-no-files-found: error
