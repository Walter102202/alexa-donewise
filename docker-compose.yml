services:
  donewise-server:
    build:
      context: .
      target: server
    env_file: .env.example
    environment:
      HOST: donewise-server
      PORT: "8765"
      DONEWISE_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${DONEWISE_SERVER_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://donewise-server:8765/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  donewise-sim:
    build:
      context: .
      target: sim
    env_file: .env.example
    environment:
      MCP_URL: http://donewise-server:8765/mcp
    ports:
      - "127.0.0.1:${DONEWISE_SIM_PORT:-8080}:8080"
    depends_on:
      donewise-server:
        condition: service_healthy
