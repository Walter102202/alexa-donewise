[project]
name = "donewise-harness"
version = "0.1.0"
description = "Typed contracts and receipt policy for DoneWise"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2,<3", "tzdata>=2025.2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["donewise_harness"]
